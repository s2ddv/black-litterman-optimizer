[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "black-litterman-optimizer"
version = "0.1.0"
description = "Research implementation of Black-Litterman with Idzorek view confidence"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
bl-optimizer = "black_litterman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
